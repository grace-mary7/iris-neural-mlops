name: Iris MLOps Pipeline

on:
  push:
    branches: [master]
    paths:
      - "iris.csv"
      - "iris.csv.dvc"
      - "validate_data.py"
      - "train_model.py"
      - "evaluate_model.py"
      - "dvc.yaml"
      - "requirements.txt"
      - ".dvc/config"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

jobs:
  validate-train-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DagsHub authentication
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user grace-mary7
          dvc remote modify dagshub --local password "$DAGSHUB_TOKEN"

      - name: Pull DVC data
        run: dvc pull

      - name: Reproduce MLOps pipeline
        run: dvc repro